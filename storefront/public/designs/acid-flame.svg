<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8244B" />
      <stop offset="45%" stop-color="#FF4D24" />
      <stop offset="85%" stop-color="#FF9A3D" />
      <stop offset="100%" stop-color="#FFF275" />
    </linearGradient>
    <filter id="distress">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Distressed Metal Top Arch -->
  <g filter="url(#distress)">
    <text x="400" y="180" fill="url(#fireGrad)" font-family="Impact, sans-serif" font-size="94" font-weight="900" text-anchor="middle" letter-spacing="10" stroke="#000000" stroke-width="4">
      RARE EMBER
    </text>
  </g>

  <!-- Subtitle Tag -->
  <text x="400" y="225" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="6">
    WORLD TOUR • HEAVYWEIGHT DIVISION • 1998
  </text>

  <!-- Roaring Flames Vector Graphic -->
  <g transform="translate(400, 430)">
    <!-- Central Skull & Flame Silhouette -->
    <path d="M 0 160 
             C -60 140, -140 100, -180 0 
             C -200 -70, -170 -160, -120 -240 
             C -100 -180, -70 -130, -50 -100 
             C -30 -160, 0 -270, 40 -300 
             C 30 -220, 60 -160, 100 -120 
             C 120 -150, 150 -180, 180 -220 
             C 170 -140, 190 -70, 160 20 
             C 130 110, 50 150, 0 160 Z"
          fill="url(#fireGrad)" stroke="#121110" stroke-width="6" />

    <!-- Inner Core Flame -->
    <path d="M 0 120 
             C -40 100, -90 70, -100 0 
             C -110 -50, -80 -110, -50 -160 
             C -40 -120, -20 -80, 0 -60 
             C 10 -110, 30 -180, 50 -200 
             C 50 -140, 70 -100, 90 -60 
             C 110 -20, 90 60, 0 120 Z" 
          fill="#FFF275" opacity="0.95" />

    <!-- Cross Bones Silhouette Behind -->
    <line x1="-160" y1="-100" x2="160" y2="100" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.3" />
    <line x1="160" y1="-100" x2="-160" y2="100" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- Barbed Wire Graphic Divider -->
  <g transform="translate(200, 620)">
    <line x1="0" y1="0" x2="400" y2="0" stroke="#FF4D24" stroke-width="4" />
    <!-- Barbs -->
    <line x1="60" y1="-12" x2="80" y2="12" stroke="#FFFFFF" stroke-width="3" />
    <line x1="80" y1="-12" x2="60" y2="12" stroke="#FFFFFF" stroke-width="3" />
    <line x1="180" y1="-12" x2="200" y2="12" stroke="#FFFFFF" stroke-width="3" />
    <line x1="200" y1="-12" x2="180" y2="12" stroke="#FFFFFF" stroke-width="3" />
    <line x1="300" y1="-12" x2="320" y2="12" stroke="#FFFFFF" stroke-width="3" />
    <line x1="320" y1="-12" x2="300" y2="12" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Bottom Archival Text -->
  <text x="400" y="680" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle" letter-spacing="8">
    BURNING SPIRIT NEVER FADES
  </text>
  <text x="400" y="715" fill="#FF4D24" font-family="'Courier New', monospace" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="4">
    TIRUPUR MILLS • 240 GSM COMBED ACID WASH
  </text>
</svg>
