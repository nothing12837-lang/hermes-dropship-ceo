<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="stoicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Stoic Maxim Header -->
  <text x="400" y="110" fill="#F59E0B" font-family="'Times New Roman', serif" font-size="56" font-weight="900" text-anchor="middle" letter-spacing="8">
    MEMENTO MORI
  </text>
  <text x="400" y="150" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="4">
    AMOR FATI • THE OBSTACLE IS THE WAY
  </text>

  <!-- Classical Laurel Silhouette & Hourglass (Transparent) -->
  <g transform="translate(400, 390)">
    <!-- Classical Greek Columns -->
    <line x1="-180" y1="-140" x2="-180" y2="140" stroke="#F59E0B" stroke-width="6" opacity="0.4" />
    <line x1="180" y1="-140" x2="180" y2="140" stroke="#F59E0B" stroke-width="6" opacity="0.4" />

    <!-- Laurel Wreath Circle -->
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#stoicGrad)" stroke-width="8" stroke-dasharray="16 12" />

    <!-- Central Hourglass -->
    <polygon points="-70,-100 70,-100 0,0" fill="none" stroke="#F59E0B" stroke-width="8" />
    <polygon points="-70,100 70,100 0,0" fill="none" stroke="#F59E0B" stroke-width="8" />
    
    <!-- Falling Sand / Embers -->
    <circle cx="0" cy="35" r="18" fill="url(#stoicGrad)" />
    <circle cx="0" cy="65" r="26" fill="url(#stoicGrad)" />

    <!-- Roman Numeral MCMXCVIII -->
    <text x="0" y="10" fill="#FFFFFF" font-family="'Times New Roman', serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="3">
      MARCUS AURELIUS
    </text>
  </g>

  <!-- Bottom Archival Seal -->
  <text x="400" y="670" fill="#FDE68A" font-family="'Times New Roman', serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="4">
    IRON MINDSET • TIRUPUR HEAVYWEIGHT
  </text>
  <line x1="160" y1="695" x2="640" y2="695" stroke="#D97706" stroke-width="4" stroke-linecap="round" />
</svg>
