<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="redSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8244B" />
      <stop offset="100%" stop-color="#B91C1C" />
    </radialGradient>
  </defs>

  <!-- Big Red Rising Sun Circle -->
  <circle cx="400" cy="380" r="190" fill="url(#redSun)" opacity="0.9" />

  <!-- Rough Ensō Ink Brush Ring -->
  <g transform="translate(400, 380)">
    <circle cx="0" cy="0" r="230" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-dasharray="1200" stroke-dashoffset="180" stroke-linecap="round" opacity="0.95" />
    <!-- Ink Splatters -->
    <circle cx="-210" cy="-120" r="10" fill="#FFFFFF" />
    <circle cx="-240" cy="-90" r="5" fill="#FFFFFF" />
    <circle cx="210" cy="140" r="8" fill="#FFFFFF" />
    <circle cx="240" cy="160" r="4" fill="#FFFFFF" />
  </g>

  <!-- Central Crossed Katanas & Samurai Silhouette -->
  <g transform="translate(400, 380)">
    <!-- Katana 1 -->
    <line x1="-220" y1="-220" x2="220" y2="220" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <line x1="160" y1="160" x2="220" y2="220" stroke="#18181b" stroke-width="12" stroke-linecap="square" />
    <circle cx="155" cy="155" r="14" fill="#FF4D24" />

    <!-- Katana 2 -->
    <line x1="220" y1="-220" x2="-220" y2="220" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <line x1="-160" y1="160" x2="-220" y2="220" stroke="#18181b" stroke-width="12" stroke-linecap="square" />
    <circle cx="-155" cy="155" r="14" fill="#FF4D24" />

    <!-- Japanese Kanji: 浪人 (Ronin) -->
    <text x="0" y="35" fill="#FFFFFF" font-family="'Noto Serif JP', serif, sans-serif" font-weight="900" font-size="140" text-anchor="middle" letter-spacing="16">
      浪人
    </text>
  </g>

  <!-- Red Hanko Stamp (印) -->
  <rect x="580" y="240" width="50" height="50" fill="#B91C1C" stroke="#FFFFFF" stroke-width="2" rx="6" />
  <text x="605" y="275" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="28" text-anchor="middle">希</text>

  <!-- Top Kanji & English Header -->
  <text x="400" y="110" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="26" text-anchor="middle" letter-spacing="12">
    武士道 • BUSHIDO SPIRIT
  </text>
  <text x="400" y="140" fill="#FF4D24" font-family="'Courier New', monospace" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="6">
    THE MASTERLESS WARRIOR DIVISION
  </text>

  <!-- Bottom Archival Details -->
  <text x="400" y="690" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="10">
    MONOCHROME RONIN
  </text>
  <text x="400" y="725" fill="#a1a1aa" font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="4">
    RARE EMBER ARCHIVES • 240 GSM HEAVYWEIGHT
  </text>
</svg>
