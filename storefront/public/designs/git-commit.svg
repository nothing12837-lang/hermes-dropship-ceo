<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Header Accent Line -->
  <line x1="120" y1="120" x2="680" y2="120" stroke="#10B981" stroke-width="4" stroke-linecap="round" />

  <!-- macOS Style Traffic Lights -->
  <circle cx="140" cy="95" r="8" fill="#EF4444" />
  <circle cx="170" cy="95" r="8" fill="#F59E0B" />
  <circle cx="200" cy="95" r="8" fill="#10B981" />

  <text x="440" y="102" fill="#38BDF8" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="3">
    RARE EMBER // PRODUCTION ARCHIVE
  </text>

  <!-- Terminal Syntax Content -->
  <g transform="translate(120, 190)" font-family="'Courier New', monospace">
    <!-- Prompt 1 -->
    <text x="0" y="0" fill="#10B981" font-size="24" font-weight="900">➜</text>
    <text x="35" y="0" fill="#38BDF8" font-size="24" font-weight="900">workspace</text>
    <text x="185" y="0" fill="#a1a1aa" font-size="24" font-weight="700">git:(</text>
    <text x="250" y="0" fill="#EF4444" font-size="24" font-weight="900">main</text>
    <text x="305" y="0" fill="#a1a1aa" font-size="24" font-weight="700">)</text>
    <text x="340" y="0" fill="#FFFFFF" font-size="24" font-weight="800">git add reality.ts</text>

    <!-- Prompt 2 -->
    <text x="0" y="70" fill="#10B981" font-size="24" font-weight="900">➜</text>
    <text x="35" y="70" fill="#38BDF8" font-size="24" font-weight="900">workspace</text>
    <text x="185" y="70" fill="#a1a1aa" font-size="24" font-weight="700">git:(</text>
    <text x="250" y="70" fill="#EF4444" font-size="24" font-weight="900">main</text>
    <text x="305" y="70" fill="#a1a1aa" font-size="24" font-weight="700">)</text>
    <text x="340" y="70" fill="#FFFFFF" font-size="24" font-weight="800">git commit -m "build dreams"</text>

    <!-- Git Output -->
    <text x="35" y="140" fill="#a1a1aa" font-size="18" font-weight="600">[main 0x7f4a] 100% test coverage • 0 bugs found</text>
    <text x="35" y="175" fill="#10B981" font-size="18" font-weight="800">2 files changed, 240 GSM insertions(+), 0 deletions(-)</text>

    <!-- Prompt 3: Force Push -->
    <text x="0" y="250" fill="#10B981" font-size="24" font-weight="900">➜</text>
    <text x="35" y="250" fill="#38BDF8" font-size="24" font-weight="900">workspace</text>
    <text x="185" y="250" fill="#a1a1aa" font-size="24" font-weight="700">git:(</text>
    <text x="250" y="250" fill="#EF4444" font-size="24" font-weight="900">main</text>
    <text x="305" y="250" fill="#a1a1aa" font-size="24" font-weight="700">)</text>
    <text x="340" y="250" fill="#FF4D24" font-size="24" font-weight="900">git push --force origin destiny</text>

    <!-- Live Execution Status -->
    <text x="35" y="315" fill="#F59E0B" font-size="18" font-weight="700">Enumerating objects: 100, done.</text>
    <text x="35" y="350" fill="#38BDF8" font-size="18" font-weight="700">Writing objects: 100% (100/100), 240 KiB | 12.00 MiB/s</text>
    <text x="35" y="390" fill="#10B981" font-size="22" font-weight="900">To https://github.com/rareember/live.git</text>
    <text x="35" y="425" fill="#10B981" font-size="20" font-weight="900"> * [new branch]  main -&gt; main (deployed to production)</text>
  </g>

  <!-- Bottom Terminal Accent Line -->
  <line x1="120" y1="680" x2="680" y2="680" stroke="#FF4D24" stroke-width="4" stroke-linecap="round" />
</svg>
