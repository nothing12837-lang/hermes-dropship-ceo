<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="motoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
  </defs>

  <!-- Speed Racing Stripes -->
  <path d="M 80 80 L 140 80 L 100 720 L 40 720 Z" fill="#EF4444" opacity="0.4" />
  <path d="M 160 80 L 200 80 L 140 720 L 100 720 Z" fill="#F97316" opacity="0.4" />

  <!-- Grand Prix Header -->
  <text x="440" y="120" fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="58" font-weight="900" text-anchor="middle" letter-spacing="6">
    SCUDERIA EMBER
  </text>
  <text x="440" y="160" fill="#EF4444" font-family="'Courier New', monospace" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="4">
    9000 RPM • REDLINE TELEMETRY • MONACO 1988
  </text>

  <!-- Tachometer Dial (Transparent Screenprint) -->
  <g transform="translate(440, 390)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="170" fill="none" stroke="#27272A" stroke-width="8" />
    
    <!-- Redline Arc -->
    <path d="M 70 -130 A 150 150 0 0 1 150 0" fill="none" stroke="#EF4444" stroke-width="16" stroke-linecap="round" />
    <path d="M -130 70 A 150 150 0 0 1 70 -130" fill="none" stroke="#FACC15" stroke-width="10" stroke-linecap="round" />

    <!-- Tachometer Needle -->
    <polygon points="-8,15 8,15 0,-140" fill="#EF4444" transform="rotate(45)" />
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#EF4444" stroke-width="4" />

    <!-- Center RPM Display -->
    <text x="0" y="75" fill="#FFFFFF" font-family="'Impact', sans-serif" font-size="52" font-weight="900" text-anchor="middle">
      9,000
    </text>
    <text x="0" y="105" fill="#FACC15" font-family="'Courier New', monospace" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="3">
      MAX APEX OUTPUT
    </text>
  </g>

  <!-- Checkered Flag Bar -->
  <text x="440" y="670" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="4">
    BOX BOX BOX • SLICK TYRE DIVISION
  </text>
  <line x1="160" y1="695" x2="720" y2="695" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
</svg>
