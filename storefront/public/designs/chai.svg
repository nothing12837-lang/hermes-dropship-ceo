<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="chaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFBEB" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Dark Frame -->
  <rect x="70" y="70" width="660" height="660" rx="36" fill="#0C0A09" stroke="#D97706" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Desi Typography Top -->
  <text x="400" y="155" fill="#F59E0B" font-family="Impact, sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="8">
    CUTTING CHAI CLUB
  </text>
  <text x="400" y="195" fill="#A1A1AA" font-family="'Courier New', monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="5">
    ESTD. 1998 • TAPRI TO STREETWEAR • 240 GSM
  </text>

  <!-- Rising Steam Swirls -->
  <g transform="translate(400, 290)">
    <path d="M -60 20 C -90 -40, -30 -90, -60 -140" fill="none" stroke="url(#steamGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 0 30 C 40 -30, -20 -90, 20 -160" fill="none" stroke="url(#steamGrad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 60 20 C 30 -40, 90 -90, 60 -140" fill="none" stroke="url(#steamGrad)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Cutting Glass Iconography -->
  <g transform="translate(400, 440)">
    <!-- Glass Body -->
    <path d="M -80 -100 L -60 120 C -55 150, 55 150, 60 120 L 80 -100 Z" fill="#1C1917" stroke="#F59E0B" stroke-width="8" />
    <!-- Tea Liquid Level -->
    <path d="M -66 -20 L -56 115 C -50 135, 50 135, 56 115 L 66 -20 Z" fill="url(#chaiGrad)" />
    <!-- Glass Facet Ridges -->
    <line x1="-30" y1="-90" x2="-22" y2="120" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.6" />
    <line x1="0" y1="-90" x2="0" y2="130" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.6" />
    <line x1="30" y1="-90" x2="22" y2="120" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.6" />
    <!-- Glass Rim -->
    <ellipse cx="0" cy="-100" rx="80" ry="16" fill="#292524" stroke="#F59E0B" stroke-width="6" />
  </g>

  <!-- Bottom Badges -->
  <rect x="180" y="605" width="440" height="42" rx="12" fill="#1C1917" stroke="#D97706" stroke-width="2" />
  <text x="400" y="632" fill="#FDE68A" font-family="'Courier New', monospace" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="3">
    FUELING BUILDERS • 100% MASALA CADENCE
  </text>
</svg>
