<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="varsityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <!-- Collegiate Arch Top -->
  <path id="archPath" d="M 120 180 Q 400 90 680 180" fill="none" />
  <text fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" letter-spacing="10">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">
      RARE EMBER
    </textPath>
  </text>

  <!-- Large Chenille Varsity Monogram "RE" (Transparent Screenprint) -->
  <g transform="translate(400, 390)">
    <!-- Shield Outline -->
    <path d="M -160 -130 L 160 -130 L 160 40 C 160 150, 0 200, 0 200 C 0 200, -160 150, -160 40 Z" fill="none" stroke="#F97316" stroke-width="10" />
    
    <!-- Crossed Flags Motif -->
    <line x1="-110" y1="120" x2="110" y2="-90" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <line x1="110" y1="120" x2="-110" y2="-90" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />

    <!-- Big Bold "98" -->
    <text x="0" y="65" fill="url(#varsityGrad)" font-family="'Impact', sans-serif" font-size="140" font-weight="900" text-anchor="middle" stroke="#FFFFFF" stroke-width="5">
      98
    </text>
  </g>

  <!-- Subtitle Ribbon -->
  <text x="400" y="670" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="5">
    ALL-INDIA VARSITY DIVISION
  </text>
  <line x1="180" y1="695" x2="620" y2="695" stroke="#EA580C" stroke-width="5" stroke-linecap="round" />
</svg>
