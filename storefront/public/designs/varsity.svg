<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="varsityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <rect x="70" y="70" width="660" height="660" rx="36" fill="#0A0A0A" stroke="#EA580C" stroke-width="4" />

  <!-- Collegiate Arch Top -->
  <path id="archPath" d="M 160 210 Q 400 130 640 210" fill="none" />
  <text fill="#FFFFFF" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="8">
    <textPath href="#archPath" startOffset="50%" text-anchor="middle">
      RARE EMBER
    </textPath>
  </text>

  <!-- Large Chenille Varsity Monogram "RE" -->
  <g transform="translate(400, 390)">
    <!-- Shield Background -->
    <path d="M -150 -130 L 150 -130 L 150 40 C 150 140, 0 190, 0 190 C 0 190, -150 140, -150 40 Z" fill="#171717" stroke="#F97316" stroke-width="8" />
    
    <!-- Crossed Flags / Bats Motif -->
    <line x1="-100" y1="110" x2="100" y2="-90" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
    <line x1="100" y1="110" x2="-100" y2="-90" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />

    <!-- Big Bold "98" -->
    <text x="0" y="55" fill="url(#varsityGrad)" font-family="'Impact', sans-serif" font-size="130" font-weight="900" text-anchor="middle" stroke="#FFFFFF" stroke-width="4">
      98
    </text>
  </g>

  <!-- Subtitle Ribbon -->
  <rect x="190" y="605" width="420" height="42" rx="10" fill="#EA580C" />
  <text x="400" y="632" fill="#FFFFFF" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="4">
    ALL-INDIA VARSITY DIVISION
  </text>
</svg>
