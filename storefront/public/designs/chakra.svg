<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="chakraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Sanskrit & Streetwear Header -->
  <text x="400" y="110" fill="#F97316" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="8">
    SUDARSHANA DHARMA
  </text>
  <text x="400" y="150" fill="#FCD34D" font-family="'Courier New', monospace" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="4">
    कर्मण्येवाधिकारस्ते मा फलेषु कदाचन • 1200 DPI
  </text>

  <!-- Sacred Geometry Chakra Mandala (100% Transparent Die-Cut) -->
  <g transform="translate(400, 410)">
    <!-- Outer Radiant Ring -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="url(#chakraGrad)" stroke-width="5" stroke-dasharray="10 8" />
    <circle cx="0" cy="0" r="190" fill="none" stroke="#F59E0B" stroke-width="3" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#FF4D24" stroke-width="7" />

    <!-- 16 Blades / Spokes -->
    <g stroke="url(#chakraGrad)" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-160" x2="0" y2="160" />
      <line x1="-160" y1="0" x2="160" y2="0" />
      <line x1="-113" y1="-113" x2="113" y2="113" />
      <line x1="-113" y1="113" x2="113" y2="-113" />
      <line x1="-148" y1="-60" x2="148" y2="60" />
      <line x1="-60" y1="-148" x2="60" y2="148" />
      <line x1="60" y1="-148" x2="-60" y2="148" />
      <line x1="148" y1="-60" x2="-148" y2="60" />
    </g>

    <!-- Center Trishul Motif -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#F59E0B" stroke-width="6" />
    <circle cx="0" cy="0" r="24" fill="url(#chakraGrad)" />
  </g>

  <!-- Footer Tagline -->
  <text x="400" y="700" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="5">
    BHARATIYA WARRIOR ARCHIVE • RARE EMBER
  </text>
</svg>
