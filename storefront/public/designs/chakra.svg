<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="chakraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect x="70" y="70" width="660" height="660" rx="36" fill="#0C0A09" stroke="#FF4D24" stroke-width="3" stroke-opacity="0.5" />

  <!-- Sanskrit & Streetwear Header -->
  <text x="400" y="150" fill="#F97316" font-family="Impact, sans-serif" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="8">
    SUDARSHANA DHARMA
  </text>
  <text x="400" y="188" fill="#FCD34D" font-family="'Courier New', monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="4">
    कर्मण्येवाधिकारस्ते मा फलेषु कदाचन • 1200 DPI ARCHIVE
  </text>

  <!-- Sacred Geometry Chakra Mandala -->
  <g transform="translate(400, 420)">
    <!-- Outer Radiant Ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#chakraGrad)" stroke-width="4" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="160" fill="none" stroke="#F59E0B" stroke-width="2" />
    <circle cx="0" cy="0" r="140" fill="#1C1917" stroke="#FF4D24" stroke-width="6" />

    <!-- 16 Blades / Spokes -->
    <g stroke="url(#chakraGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-140" x2="0" y2="140" />
      <line x1="-140" y1="0" x2="140" y2="0" />
      <line x1="-99" y1="-99" x2="99" y2="99" />
      <line x1="-99" y1="99" x2="99" y2="-99" />
      <line x1="-130" y1="-53" x2="130" y2="53" />
      <line x1="-53" y1="-130" x2="53" y2="130" />
      <line x1="53" y1="-130" x2="-53" y2="130" />
      <line x1="130" y1="-53" x2="-130" y2="53" />
    </g>

    <!-- Center Trishul Motif -->
    <circle cx="0" cy="0" r="50" fill="#0C0A09" stroke="#F59E0B" stroke-width="5" />
    <circle cx="0" cy="0" r="18" fill="url(#chakraGrad)" />
  </g>

  <!-- Footer Tagline -->
  <text x="400" y="650" fill="#A1A1AA" font-family="'Courier New', monospace" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="4">
    BHARATIYA WARRIOR ARCHIVE • RARE EMBER
  </text>
</svg>
