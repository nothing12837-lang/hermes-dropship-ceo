name: Hermes Dropship 24x7 (Worker A)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: hermes-dropship-singleton
  cancel-in-progress: true

jobs:
  run-hermes-a:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Hermes Dropship CEO
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: "https://rareember-store.vercel.app"
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: |
          timeout 14400 python dropship_gateway.py || echo "Cycle completed gracefully"

      - name: Sync Persistent State & Memory
        if: always()
        run: |
          git config user.name "Hermes CEO Bot"
          git config user.email "hermes@rareember.com"
          git pull --rebase origin main || true
          git add HERMES_MEMORY/*.json || true
          git commit -m "chore(memory): persist seen orders and idempotency state" || true
          git push origin main || true
