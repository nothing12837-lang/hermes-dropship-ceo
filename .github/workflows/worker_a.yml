name: Radha Dropship Midnight Sync (Worker A)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'  # 12:00 AM Midnight IST (Clean Daily Sync)

permissions:
  contents: read

concurrency:
  group: radha-dropship-singleton
  cancel-in-progress: true

jobs:
  run-radha-daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute CEO Nightly Reflection & Strategy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          SITE_URL: "https://rareember-store.vercel.app"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          python -c "from radha_ceo.brain import RadhaBrain; b = RadhaBrain(); print(b.perceive())"

      - name: Execute Arjun Meesho Procurement Sentinel (Zero-Loss Audit)
        env:
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          SITE_URL: "https://rareember-store.vercel.app"
        run: |
          python arjun_sentinel.py

      - name: Alert on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALLOWED_USERS%%,*}" \
            -d "parse_mode=HTML" \
            -d "text=🚨 <b>RADHA MIDNIGHT SYNC FAILED</b>%0ACheck GitHub Actions run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
