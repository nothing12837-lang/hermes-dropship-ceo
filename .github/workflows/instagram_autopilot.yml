name: RareEmber Instagram Campaign Drop (Manual / On-Demand)

on:
  workflow_dispatch:
    inputs:
      campaign_type:
        description: 'Campaign Angle'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - catalog
          - problem_solver
          - festive_deal
          - trust_builder
      format:
        description: 'Content Format (Auto, Post Image or Reel Video)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - post
          - reel

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Execute Instagram Autopilot Drop
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "5238068527"
          STORE_URL: "https://rareember-store.vercel.app"
        run: |
          python ig_autopilot.py --campaign-type "${{ github.event.inputs.campaign_type || 'auto' }}" --format "${{ github.event.inputs.format || 'auto' }}"

      - name: Upload Generated Creative Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-creative-output
          path: |
            generated_posts/*.jpg
            generated_posts/reels/*.mp4
            generated_posts/reels/*.jpg
          retention-days: 7
