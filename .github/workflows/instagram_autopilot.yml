name: RareEmber Instagram 24x7 Autopilot (5 Daily Drops)

# on:
#   schedule:
#     - cron: '30 4 * * *'
#     - cron: '0 8 * * *'
#     - cron: '0 12 * * *'
#     - cron: '30 14 * * *'
#     - cron: '30 16 * * *'
on:
  workflow_dispatch:
    inputs:
      campaign_type:
        description: 'Campaign Angle'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - catalog
          - problem_solver
          - festive_deal
          - trust_builder
      format:
        description: 'Content Format (Auto, Post Image, or Video Reel)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - post
          - reel

permissions:
  contents: write

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Ensure FFmpeg Installed
        run: which ffmpeg || sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute Instagram Autopilot Drop
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "5238068527"
          STORE_URL: "https://rareember-store.vercel.app"
        run: |
          python ig_autopilot.py --campaign-type "${{ github.event.inputs.campaign_type || 'auto' }}" --format "${{ github.event.inputs.format || 'auto' }}"

      - name: Commit Updated Post History & Session
        if: always()
        run: |
          git config --global user.name "Hermes Autopilot"
          git config --global user.email "hermes@rareember.com"
          git add posted_history.json session.json 2>/dev/null || true
          git commit -m "chore: record auto-posted product history & session [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
