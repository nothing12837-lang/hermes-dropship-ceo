name: RareEmber Cloud Health & Security Sentinel

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:17 UTC. Previously the workflow only had workflow_dispatch,
    # so the "Nightly Cloud Health Sentinel" never ran on a schedule at all.
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: rarember-health-sentinel
  cancel-in-progress: true

jobs:
  cloud-health-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install requests pg8000

      - name: Run Nightly Cloud Health Sentinel
        env:
          SITE_URL: "https://www.rareember.shop"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          SUPABASE_DB_HOST: "db.qdkkxpfhwrwyoardlceo.supabase.co"
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER || 'postgres' }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME || 'postgres' }}
          SUPABASE_DB_PASS: ${{ secrets.SUPABASE_DB_PASS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://qdkkxpfhwrwyoardlceo.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFka2t4cGZod3J3eW9hcmRsY2VvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4Njc2OTcsImV4cCI6MjEwNjQ0MzY5N30.qFvuYQ1G9NvYGYXWVtR6b9dPScOuUIfeVQ8yX3y1DJo' }}
        run: |
          python tools/nightly_health_check.py
