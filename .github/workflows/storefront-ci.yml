name: Storefront CI

on:
  push:
    branches: [main]
    paths: ["storefront/**"]
  pull_request:
    paths: ["storefront/**"]

defaults:
  run:
    working-directory: storefront

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # The lint gate was dead: eslint.config.mjs imported subpaths that do
      # not exist, so `eslint` crashed with ERR_MODULE_NOT_FOUND and CI never
      # ran it. Now it runs and blocks on errors.
      - run: npm run lint -- --max-warnings=9999
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storefront/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
